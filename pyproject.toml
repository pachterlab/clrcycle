[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clrcycle"
version = "0.1.0"
description = "Circular projection for nonnegative compositional data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/pachterlab/clrcycle"
Repository = "https://github.com/pachterlab/clrcycle.git"

[project.scripts]
clrcycle = "clrcycle.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clrcycle*"]
