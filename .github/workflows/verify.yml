name: verify-clrcycle

on:
  push:
  pull_request:

jobs:
  verify-tool-and-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: >-
          python -m clrcycle
          tests/data/toy_cycle.csv
          --output-dir "$RUNNER_TEMP/clrcycle-output"
          --all-features
      - run: test -s "$RUNNER_TEMP/clrcycle-output/sample_coordinates.csv"
      - run: bash scripts/download_circadian_data.sh
      - run: >-
          python scripts/run_all_tissues_clr_acs.py
          --analysis label-free
          --results-dir "$RUNNER_TEMP/results"
      - run: test -s "$RUNNER_TEMP/results/all_tissues_unsupervised_repeat_periodic_96/all_tissue_metrics.csv"
